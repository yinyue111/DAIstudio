# Seed config for model_configs + defaults (only used on first boot to populate
# the DB; afterwards edit live via the admin UI / PUT /api/admin/models).
#
# Gateway base_url + api_key can live in .env as a fallback, or be configured
# per model from the admin UI. API keys saved from the admin UI are encrypted
# with MODEL_CONFIG_SECRET/PAYMENT_CONFIG_SECRET, never stored here.
#
# IMPORTANT: set model_id to the real ids your gateway exposes. The values below
# were aligned with the current /v1/models response from the configured gateway
# on 2026-06-16.

models:
  - use: prompt        # 直接输入提示词优化 (Anthropic /v1/messages)
    model_id: gemini-3.5-flash-low
    cost_credits: 1
    unlock_cost: 0
    enabled: true

  - use: vision        # 反推:图 -> 结构化提示词  (/v1/chat/completions)
    model_id: gpt-5.5
    cost_credits: 2
    unlock_cost: 0
    enabled: true
    extra:
      official_pricing:
        source: https://openai.com/api/pricing/
        checked_at: "2026-06-21"
        currency: USD
        unit: per_1m_tokens
        input_per_1m: 5.0
        cached_input_per_1m: 0.5
        output_per_1m: 30.0
        usd_to_cny: 7.25
        credit_value_cny: 0.10
        formula: "ceil(((input_tokens-cached_tokens)*5 + cached_tokens*0.5 + output_tokens*30) / 1000000 * usd_to_cny / credit_value_cny)"

  - use: image         # 文生图:词 -> 图          (/v1/images/generations)
    model_id: gpt-image-2
    cost_credits: 15    # fallback/admin display; runtime pricing is size-based
    unlock_cost: 0      # generated assets are visible in history without HD unlock fee
    enabled: true
    # Optional: enable true 图+指令->图 (reverse-off). When set, an instruction
    # with an image source is sent to this image-to-image endpoint instead of
    # plain text->image. Leave unset to always use text->image.
    # extra:
    #   edit_path: /v1/images/edits

  - use: video         # 文生视频 (Volcengine Ark / Doubao Seedance, async)
    model_id: doubao-seedance-2-0-pro
    cost_credits: 16     # fallback/admin display; final runtime pricing is per-second
    unlock_cost: 0
    enabled: true
    extra:
      preview_cost: 15   # cheap freeze for the preview stage
      official_pricing:
        source: https://www.volcengine.com/docs/82379/1544106
        checked_at: "2026-06-21"
        provider: volcengine_ark
        model_family: Seedance 2.0
        currency: CNY
        unit: per_1m_tokens
        total_per_1m: 31.0
        credit_value_cny: 0.10
        formula: "ceil(total_tokens * 31 / 1000000 / credit_value_cny)"
      # Optional provider-specific recovery hook. Fill these only when the
      # upstream gateway supports querying a submitted video by request_id; on
      # submit timeouts the worker can then recover external_task_id and resume
      # polling instead of leaving the task in manual needs_review.
      # request_query_path: /v1/videos/by-request/{request_id}
      # request_query_result_path: data.task
      # request_query_id_field: id
      # request_query_status_field: status
    # Video gateway base_url/api_key + format=ark can be configured in the admin
    # UI, or via VIDEO_GATEWAY_BASE_URL / VIDEO_GATEWAY_API_KEY / VIDEO_GATEWAY_FORMAT.

defaults:
  reverse_prompt_enabled: true
  sms_auth_enabled: false
  payment_enabled: false
  image_n: 1
  image_size: 1024x1024
