# One-command stack: Postgres + Redis + API + Worker + Beat + Frontend.
#   docker compose up -d --build
# First run, create the admin + seed (set a strong ADMIN_PASSWORD, or omit it
# and init_db prints a one-time generated password — never a fixed default):
#   ADMIN_PASSWORD='<strong-secret>' docker compose run --rm -e ADMIN_PASSWORD api \
#       python -m scripts.init_db --admin-phone 13800000000 --credits 1000
# The migrate service runs Alembic first; init_db only seeds config/admin and
# does not create tables in production.
# Gateway key / other secrets are read from backend/.env (env_file below).
# DATABASE_URL / REDIS_URL are overridden here for the container network.
# Reverse-proxy production defaults the browser API to same-origin /api and the
# frontend server-side session probe to http://api:8000. If you access Compose
# directly at :3000 without a reverse proxy, set NEXT_PUBLIC_API_BASE to the
# browser-visible backend origin, for example http://localhost:8000.
# Production: set POSTGRES_PASSWORD in the shell/root .env for Compose DB URL
# interpolation. Backend application secrets (METRICS_TOKEN,
# PAYMENT_CONFIG_SECRET, gateway keys, payment keys) are read from backend/.env
# through env_file below so there is one source of truth.
# Service ports bind to localhost by default; publish them through nginx/reverse proxy.
# TRUSTED_PROXY_IPS should list only the actual reverse-proxy source IPs. Do not
# trust the whole Docker private range; use 127.0.0.1 for the default host proxy
# layout, or a dedicated narrow network/IP when the proxy runs in a container.

name: ai-media-studio

x-pg-password: &pg_password ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: *pg_password
      POSTGRES_DB: ai_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    command: alembic upgrade head
    volumes:
      - media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - media:/app/storage
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    # Critical short-lived queues only. Keep payment reconciliation, cleanup,
    # default jobs, and video polling responsive even when parse/video/image
    # workloads are saturated.
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_CRITICAL_POOL:-threads} --concurrency=${WORKER_CRITICAL_CONCURRENCY:-2} -Q ${WORKER_CRITICAL_QUEUES:-default,payment,video_poll,cleanup}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    mem_limit: ${WORKER_CRITICAL_MEM_LIMIT:-1g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker_image:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_IMAGE_POOL:-threads} --concurrency=${WORKER_IMAGE_CONCURRENCY:-4} -Q ${WORKER_IMAGE_QUEUES:-image}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    mem_limit: ${WORKER_IMAGE_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker_video:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_VIDEO_SUBMIT_POOL:-solo} --concurrency=${WORKER_VIDEO_SUBMIT_CONCURRENCY:-1} -Q ${WORKER_VIDEO_SUBMIT_QUEUES:-video_submit}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    mem_limit: ${WORKER_VIDEO_SUBMIT_MEM_LIMIT:-1g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker_video_download:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_VIDEO_DOWNLOAD_POOL:-solo} --concurrency=${WORKER_VIDEO_DOWNLOAD_CONCURRENCY:-1} -Q ${WORKER_VIDEO_DOWNLOAD_QUEUES:-video_download}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    mem_limit: ${WORKER_VIDEO_DOWNLOAD_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker_parse:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_PARSE_POOL:-solo} --concurrency=${WORKER_PARSE_CONCURRENCY:-1} -Q ${WORKER_PARSE_QUEUES:-parse}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    # Chromium + anti-bot rendering can spike memory; keep parse isolated.
    mem_limit: ${WORKER_PARSE_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    build: ./backend
    restart: unless-stopped
    # Exactly ONE scheduler for the whole stack (retention cleanup, stuck-task
    # reaper, video-resume). Do not scale this service.
    command: celery -A app.celery_app.celery_app beat -l info
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping >/dev/null 2>&1 || pgrep -f 'celery.*beat' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
        API_INTERNAL_BASE: ${API_INTERNAL_BASE:-${INTERNAL_API_BASE:-http://api:8000}}
    environment:
      API_INTERNAL_BASE: ${API_INTERNAL_BASE:-${INTERNAL_API_BASE:-http://api:8000}}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  # Optional object storage (swap services/storage.py to use it):
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minio
  #     MINIO_ROOT_PASSWORD: minio12345
  #   ports: ["9000:9000", "9001:9001"]
  #   volumes: ["miniodata:/data"]

volumes:
  pgdata:
  redisdata:
  media:
  # miniodata:
