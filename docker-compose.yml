# One-command stack: Postgres + Redis + API + Worker + Beat + Frontend.
#   docker compose up -d --build
# First run, create the admin + seed (set a strong ADMIN_PASSWORD, or omit it
# and init_db prints a one-time generated password — never a fixed default):
#   ADMIN_PASSWORD='<strong-secret>' docker compose run --rm -e ADMIN_PASSWORD api \
#       python -m scripts.init_db --admin-phone 13800000000 --credits 1000
# The migrate service runs Alembic first; init_db only seeds config/admin and
# does not create tables in production.
# Gateway key / other secrets are read from BACKEND_ENV_FILE, defaulting to
# backend/.env.production. For local Docker development, run with
# BACKEND_ENV_FILE=./backend/.env DEPLOY_ENV=local.
# DATABASE_URL / REDIS_URL are overridden here for the container network.
# Reverse-proxy production defaults the browser API to same-origin /api and the
# frontend server-side session probe to http://api:8000. If you access Compose
# directly at :3000 without a reverse proxy, set NEXT_PUBLIC_API_BASE to the
# browser-visible backend origin, for example http://localhost:8000.
# Production: set POSTGRES_PASSWORD and REDIS_PASSWORD in the shell/root .env.
# They are passed separately from datastore URLs so reserved characters remain safe.
# Backend application secrets (JWT_SECRET, METRICS_TOKEN,
# PAYMENT_CONFIG_SECRET, gateway keys, payment keys) are read from
# BACKEND_ENV_FILE through env_file below so there is one source of truth.
# Service ports bind to localhost by default; publish them through nginx/reverse proxy.
# TRUSTED_PROXY_IPS should list only the actual reverse-proxy source IPs. Do not
# trust the whole Docker private range; use 127.0.0.1 for the default host proxy
# layout, or a dedicated narrow network/IP when the proxy runs in a container.

name: ai-media-studio

x-pg-password: &pg_password ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong database password}
x-redis-password: &redis_password ${REDIS_PASSWORD:?set REDIS_PASSWORD to a strong Redis password}
x-app-datastores: &app_datastores
  DATABASE_URL: postgresql+psycopg2://postgres@postgres:5432/ai_studio
  PGPASSWORD: *pg_password
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD: *redis_password
# 后端进程（api / 各 worker / beat）唯一的配置注入通道就是这个 env 文件。
# 启用 `--profile evidence` 后，三个证据 provider 的后端侧地址
# （IMAGE_EVIDENCE_DETECTOR_URL / IMAGE_EVIDENCE_SEGMENTER_URL /
# VIDEO_EVIDENCE_SEMANTIC_URL 及各自 API key / health URL）必须写进
# 该文件才会生效，正确取值见 backend/.env.example 的对应注释，
# 完整前置清单见 docs/launch-lite-release.md「解禁到 full 的前置清单」。
# 注意：不要把这些变量放进各服务的 environment: 段做 shell 透传——
# Compose v5 里 environment 的 null/空插值条目会直接盖掉 env_file 的取值，
# 未设置 shell 变量时后端会静默丢失 env 文件里配置的 URL。
x-backend-env-file: &backend_env_file
  - path: ${BACKEND_ENV_FILE:-./backend/.env.production}
    required: true
x-backend-build: &backend_build
  context: ./backend
  args:
    DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: *pg_password
      POSTGRES_DB: ai_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend_internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD to a strong Redis password}"]
    environment:
      REDIS_PASSWORD: *redis_password
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend_internal]

  migrate:
    build: *backend_build
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    command: alembic upgrade head
    volumes:
      - media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend_internal]

  api:
    build: *backend_build
    restart: unless-stopped
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - media:/app/storage
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, frontend_edge]

  worker:
    build: *backend_build
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    # Critical short-lived queues only. Keep payment reconciliation, cleanup,
    # default jobs, and video polling responsive even when parse/video/image
    # workloads are saturated.
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_CRITICAL_POOL:-threads} --concurrency=${WORKER_CRITICAL_CONCURRENCY:-2} -Q ${WORKER_CRITICAL_QUEUES:-default,payment,video_poll,cleanup}
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    mem_limit: ${WORKER_CRITICAL_MEM_LIMIT:-1g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  worker_image:
    build: *backend_build
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_IMAGE_POOL:-threads} --concurrency=${WORKER_IMAGE_CONCURRENCY:-4} -Q ${WORKER_IMAGE_QUEUES:-image}
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    mem_limit: ${WORKER_IMAGE_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  worker_video:
    build: *backend_build
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_VIDEO_SUBMIT_POOL:-solo} --concurrency=${WORKER_VIDEO_SUBMIT_CONCURRENCY:-1} -Q ${WORKER_VIDEO_SUBMIT_QUEUES:-video_submit}
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    mem_limit: ${WORKER_VIDEO_SUBMIT_MEM_LIMIT:-1g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  worker_video_download:
    build: *backend_build
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_VIDEO_DOWNLOAD_POOL:-solo} --concurrency=${WORKER_VIDEO_DOWNLOAD_CONCURRENCY:-1} -Q ${WORKER_VIDEO_DOWNLOAD_QUEUES:-video_download}
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    mem_limit: ${WORKER_VIDEO_DOWNLOAD_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  worker_parse:
    build: *backend_build
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_PARSE_POOL:-solo} --concurrency=${WORKER_PARSE_CONCURRENCY:-1} -Q ${WORKER_PARSE_QUEUES:-parse}
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    # Chromium + anti-bot rendering can spike memory; keep parse isolated.
    mem_limit: ${WORKER_PARSE_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  worker_reverse:
    build: *backend_build
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    # Keep this on threads: reverse tasks use cooperative cancellation and must
    # never enter Celery's process-killing hard-timeout path.
    # reproduction 队列也在这里消费：复刻度评估（reproduction.assess）和反推一样是
    # cv2/numpy 为主的 CPU 密集媒体分析（GIL 会在重计算里释放，线程池可用），
    # 同样依赖协作式取消 + SoftTimeLimit 兜底，且需要挂载 media 卷读取素材。
    # 放到 worker（critical）会让长评估饿死 payment/video_poll 等短任务，故与 reverse 同池隔离。
    command: celery -A app.celery_app.celery_app worker -l info --pool=threads --concurrency=${WORKER_REVERSE_CONCURRENCY:-2} -Q ${WORKER_REVERSE_QUEUES:-reverse,reproduction}
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    mem_limit: ${WORKER_REVERSE_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  worker_workflow:
    build: *backend_build
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-15m}
    # Workflow nodes can invoke providers and FFmpeg. Keep them isolated from
    # short control-plane jobs and mount the same media volume as the API.
    command: celery -A app.celery_app.celery_app worker -l info --pool=${WORKER_WORKFLOW_POOL:-threads} --concurrency=${WORKER_WORKFLOW_CONCURRENCY:-2} -Q ${WORKER_WORKFLOW_QUEUES:-workflow}
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    mem_limit: ${WORKER_WORKFLOW_MEM_LIMIT:-2g}
    volumes:
      - media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  beat:
    build: *backend_build
    restart: unless-stopped
    # Exactly ONE scheduler for the whole stack (retention cleanup, stuck-task
    # reaper, video-resume). Do not scale this service.
    command: celery -A app.celery_app.celery_app beat -l info
    env_file: *backend_env_file
    environment:
      <<: *app_datastores
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\0',b' ').lower(); sys.exit(0 if b'celery' in cmd and b'beat' in cmd else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_internal, external_access]

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
        API_INTERNAL_BASE: ${API_INTERNAL_BASE:-${INTERNAL_API_BASE:-http://api:8000}}
    environment:
      API_INTERNAL_BASE: ${API_INTERNAL_BASE:-${INTERNAL_API_BASE:-http://api:8000}}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend_edge]

  evidence_provider:
    profiles: [evidence]
    build: ./evidence_provider
    restart: unless-stopped
    environment:
      EVIDENCE_PROVIDER_API_KEY: ${EVIDENCE_PROVIDER_API_KEY:-}
      EVIDENCE_PROVIDER_DEVICE: ${EVIDENCE_PROVIDER_DEVICE:-cpu}
      EVIDENCE_PROVIDER_EAGER_LOAD: "true"
    ports:
      - "127.0.0.1:${EVIDENCE_PROVIDER_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          key = os.environ.get("EVIDENCE_PROVIDER_API_KEY", "");
          request = urllib.request.Request(
              "http://localhost:8090/health",
              headers={"Authorization": "Bearer " + key} if key else {},
          );
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: ${EVIDENCE_PROVIDER_MEM_LIMIT:-2g}
    networks: [backend_internal, analyzer_edge]

  video_semantic_provider:
    # 仅启动 provider 不够：后端还要在 BACKEND_ENV_FILE 里配置
    # VIDEO_EVIDENCE_SEMANTIC_URL=http://video_semantic_provider:8091/v1/video-semantic/analyze
    # 及配套 API key / health URL（见 backend/.env.example 注释），否则视频语义证据仍为 unsupported。
    profiles: [evidence]
    build: ./video_semantic_provider
    restart: unless-stopped
    environment:
      VIDEO_SEMANTIC_PROVIDER_API_KEY: ${VIDEO_SEMANTIC_PROVIDER_API_KEY:-}
      VIDEO_SEMANTIC_MAX_FRAMES: ${VIDEO_SEMANTIC_MAX_FRAMES:-64}
      VIDEO_SEMANTIC_MAX_FRAME_BYTES: ${VIDEO_SEMANTIC_MAX_FRAME_BYTES:-12582912}
      VIDEO_SEMANTIC_MAX_FRAME_PIXELS: ${VIDEO_SEMANTIC_MAX_FRAME_PIXELS:-24000000}
      VIDEO_SEMANTIC_MIN_MOTION_AREA_RATIO: ${VIDEO_SEMANTIC_MIN_MOTION_AREA_RATIO:-0.002}
      VIDEO_SEMANTIC_MAX_MOTION_AREA_RATIO: ${VIDEO_SEMANTIC_MAX_MOTION_AREA_RATIO:-0.70}
      VIDEO_SEMANTIC_TRACK_IOU_THRESHOLD: ${VIDEO_SEMANTIC_TRACK_IOU_THRESHOLD:-0.12}
      VIDEO_SEMANTIC_TRANSITION_THRESHOLD: ${VIDEO_SEMANTIC_TRANSITION_THRESHOLD:-0.46}
    ports:
      - "127.0.0.1:${VIDEO_SEMANTIC_PROVIDER_PORT:-8091}:8091"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          key = os.environ.get("VIDEO_SEMANTIC_PROVIDER_API_KEY", "");
          request = urllib.request.Request(
              "http://localhost:8091/health",
              headers={"Authorization": "Bearer " + key} if key else {},
          );
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: ${VIDEO_SEMANTIC_PROVIDER_MEM_LIMIT:-1g}
    networks: [backend_internal, analyzer_edge]

  audio_provider:
    profiles: [evidence]
    build:
      context: ./audio_provider
      args:
        ASR_PROVIDER_MODEL: ${ASR_PROVIDER_MODEL:-small}
    restart: unless-stopped
    environment:
      ASR_PROVIDER_API_KEY: ${ASR_PROVIDER_API_KEY:-}
      ASR_PROVIDER_MODEL: ${ASR_PROVIDER_MODEL:-small}
      ASR_PROVIDER_DEVICE: ${ASR_PROVIDER_DEVICE:-cpu}
      ASR_PROVIDER_COMPUTE_TYPE: ${ASR_PROVIDER_COMPUTE_TYPE:-int8}
      ASR_PROVIDER_EAGER_LOAD: "true"
      ASR_PROVIDER_MAX_UPLOAD_BYTES: ${ASR_PROVIDER_MAX_UPLOAD_BYTES:-50331648}
      ASR_PROVIDER_MAX_SEGMENTS: ${ASR_PROVIDER_MAX_SEGMENTS:-1000}
      ASR_PROVIDER_BEAM_SIZE: ${ASR_PROVIDER_BEAM_SIZE:-5}
    ports:
      - "127.0.0.1:${AUDIO_PROVIDER_PORT:-8092}:8092"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          key = os.environ.get("ASR_PROVIDER_API_KEY", "");
          request = urllib.request.Request(
              "http://localhost:8092/health",
              headers={"Authorization": "Bearer " + key} if key else {},
          );
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    mem_limit: ${AUDIO_PROVIDER_MEM_LIMIT:-3g}
    networks: [backend_internal, analyzer_edge]

  # 可选对象存储：S3 后端已在 services/storage.py 完整实现，无需改代码。
  # 取消注释下方 minio 服务后，在 backend 环境里设置 STORAGE_BACKEND=s3 与
  # STORAGE_S3_*（见 backend/.env.example 的 Storage 段）即可启用。
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minio
  #     MINIO_ROOT_PASSWORD: minio12345
  #   ports: ["9000:9000", "9001:9001"]
  #   volumes: ["miniodata:/data"]

volumes:
  pgdata:
  redisdata:
  media:
  # miniodata:

networks:
  backend_internal:
    internal: true
  analyzer_edge:
  frontend_edge:
  external_access:
