name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax compile
        run: python -m compileall -q app tests scripts alembic
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        # tests run on sqlite + fakeredis + eager Celery + mock gateway — no services needed
        run: pytest

  migrations:
    name: Backend — alembic migration chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ai_studio
      JWT_SECRET: ci-migration-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Exercise the real DDL on real Postgres, both directions, so a broken
      # migration is caught here instead of at the api container's boot-time upgrade.
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: alembic schema drift check
        run: alembic check
      - name: alembic downgrade base
        run: alembic downgrade base

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  compose:
    name: Docker Compose config & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config --quiet
        env:
          BACKEND_ENV_FILE: ./backend/.env.example
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          METRICS_TOKEN: ci-metrics-token
          PAYMENT_CONFIG_SECRET: ci-payment-config-secret-32-bytes-long
          SMS_PROVIDER: http
          SMS_HTTP_URL: https://sms.example.invalid/send
      - name: Build production images
        run: docker compose build api frontend
        env:
          BACKEND_ENV_FILE: ./backend/.env.example
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          NEXT_TELEMETRY_DISABLED: "1"

  release-artifact:
    name: Release artifact hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build clean source artifact
        run: |
          git archive --format=tar.gz --output=/tmp/ai-studio-source.tar.gz HEAD
      - name: Reject secrets/runtime files in artifact
        run: python scripts/check_release_artifact.py /tmp/ai-studio-source.tar.gz

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
