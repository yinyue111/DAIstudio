name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每日构建一次分析器镜像（Dockerfile 里 RUN 层预取模型权重，太慢不适合放进每次 push/PR 的主门禁）
    - cron: "23 19 * * *"

permissions:
  contents: read

# 除 compose-analyzers 外的所有 job 都用 `if: github.event_name != 'schedule'`
# 跳过每日定时触发：schedule 只为夜间分析器镜像构建服务，主门禁 job 不必每晚重跑。
jobs:
  secrets:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — lint & test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax compile
        run: python -m compileall -q app tests scripts alembic
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        # tests run on sqlite + fakeredis + eager Celery + mock gateway — no services needed
        run: pytest
      - name: Analyzer provider contract tests
        working-directory: .
        run: >-
          PYTHONPATH=. python -m pytest -q
          evidence_provider/tests
          video_semantic_provider/tests
          audio_provider/tests
      - name: Reverse prompt offline golden evaluation
        run: python scripts/evaluate_reverse_golden.py tests/fixtures/reverse_golden_samples.json

  migrations:
    name: Backend — alembic migration chain
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ai_studio
      JWT_SECRET: ci-migration-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Exercise the real DDL on real Postgres, both directions, so a broken
      # migration is caught here instead of at the api container's boot-time upgrade.
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: alembic schema drift check
        run: alembic check
      - name: alembic downgrade base
        run: alembic downgrade base

  audit:
    name: Dependency audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  sbom:
    name: SBOM
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  compose:
    name: Docker Compose config & build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate worker topology
        run: ./scripts/test_worker_parallelism.sh
      - name: Validate compose config
        run: docker compose config --quiet
        env:
          BACKEND_ENV_FILE: ./backend/.env.example
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          METRICS_TOKEN: ci-metrics-token
          PAYMENT_CONFIG_SECRET: ci-payment-config-secret-32-bytes-long
          SMS_PROVIDER: http
          SMS_HTTP_URL: https://sms.example.invalid/send
      - name: Build production images
        run: docker compose build api frontend
        env:
          BACKEND_ENV_FILE: ./backend/.env.example
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          NEXT_TELEMETRY_DISABLED: "1"

  compose-analyzers:
    name: Docker build — analyzer provider images (nightly)
    # 三个分析器镜像在 RUN 层预取模型权重，完整构建耗时/带宽都远超主门禁预算，
    # 因此只在每日定时与手动触发时构建，不阻塞普通 push/PR。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk space for model weights
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build analyzer provider images
        run: make docker-build-analyzers
        env:
          BACKEND_ENV_FILE: ./backend/.env.example
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password

  release-artifact:
    name: Release artifact hygiene
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build clean source artifact
        run: |
          git archive --format=tar.gz --output=/tmp/ai-studio-source.tar.gz HEAD
      - name: Reject secrets/runtime files in artifact
        run: python scripts/check_release_artifact.py /tmp/ai-studio-source.tar.gz

  frontend:
    name: Frontend — build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # 命名带 "mocked" 是刻意的：现有全部 Playwright 规格都通过路由拦截 mock 后端
  # （playwright.config.mjs 把 API_INTERNAL_BASE 指向 127.0.0.1:9 死端口），
  # 结构上永远打不到真实 API。这层门禁只保证前端交互流；
  # 真实前后端联调的端到端保障目前不存在，勿据此误判。
  frontend-e2e-mocked:
    name: Frontend — Playwright e2e (mocked API, 非真实端到端)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # e2e 规格通过路由拦截 mock 后端接口，webServer 由 Playwright 自行拉起 next dev，无需真实 API
      - name: Run Playwright specs (mocked backend)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: bundled
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
